name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome
      - name: Build
        run: |
          set -o pipefail
          esphome compile side-screen.yaml 2>&1 | tee build.log || {
            echo "=========== REAL ERRORS ==========="
            grep -n -i -E "error|failed|invalid" build.log | tail -25
            exit 1
          }
      - name: Collect the one image to flash at 0x0
        run: |
          F=$(find .esphome -name "firmware.factory.bin" | head -n1)
          echo "found: $F"
          cp "$F" side-screen-sunton.bin
          ls -l side-screen-sunton.bin
      - uses: actions/upload-artifact@v4
        with:
          name: side-screen-sunton
          path: side-screen-sunton.bin
