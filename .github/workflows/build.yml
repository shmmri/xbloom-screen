name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio esptool
      - name: Build
        run: |
          set -o pipefail
          pio run -e sunton 2>&1 | tee build.log || {
            echo "=========== REAL ERRORS ==========="
            grep -n -E "error:|undefined reference|fatal error|No such file" build.log | head -25
            exit 1
          }
      - name: Merge one image to flash at 0x0
        run: |
          B=.pio/build/sunton
          BOOT0=$(find ~/.platformio -name boot_app0.bin | head -n1)
          python -m esptool --chip esp32s3 merge_bin -o side-screen-sunton.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT0" 0x10000 $B/firmware.bin
          ls -l side-screen-sunton.bin
      - uses: actions/upload-artifact@v4
        with:
          name: side-screen-sunton
          path: side-screen-sunton.bin
