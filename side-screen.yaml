# Side screen: Sunton ESP32-8048S043C bring-up with ESPHome.
# The pins and timings below are the community-verified ones for this board
# (devices.esphome.io, Sunton-ESP32-8048S043C).
# It shows red, green, blue, white, then a "side" screen with a touch counter.
esphome:
  name: side-screen
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:

globals:
  - id: phase
    type: int
    initial_value: "0"
  - id: taps
    type: int
    initial_value: "0"
  - id: tx
    type: int
    initial_value: "-1"
  - id: ty
    type: int
    initial_value: "-1"

i2c:
  - id: bus_a
    scl: GPIO20
    sda: GPIO19

output:
  - platform: ledc
    pin: GPIO2
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 96
  - file: "gfonts://Roboto"
    id: font_small
    size: 32

display:
  - id: my_display
    platform: rpi_dpi_rgb
    dimensions:
      width: 800
      height: 480
    rotation: 0
    color_order: RGB
    de_pin: 40
    hsync_pin: 39
    vsync_pin: 41
    pclk_pin: 42
    pclk_inverted: true
    pclk_frequency: 16MHz
    hsync_front_porch: 8
    hsync_pulse_width: 4
    hsync_back_porch: 8
    vsync_front_porch: 8
    vsync_pulse_width: 4
    vsync_back_porch: 8
    data_pins:
      red: [45, 48, 47, 21, 14]
      green: [5, 6, 7, 15, 16, 4]
      blue: [8, 3, 46, 9, 1]
    update_interval: 1.5s
    auto_clear_enabled: false
    lambda: |-
      if (id(phase) < 4) {
        // Colour test: red, green, blue, white, 1.5 s each.
        Color c[4] = {Color(255, 0, 0), Color(0, 255, 0), Color(0, 0, 255), Color(255, 255, 255)};
        it.fill(c[id(phase)]);
        id(phase) += 1;
        return;
      }
      Color bg = Color(0x22, 0x42, 0x22);
      Color cream = Color(0xF4, 0xEF, 0xD6);
      it.fill(bg);
      it.print(40, 30, id(font_big), cream, "side");
      it.print(40, 150, id(font_small), cream, "Screen test OK. Touch the screen.");
      it.filled_rectangle(40, 220, 300, 90, Color(0x4A, 0x70, 0x3A));
      it.print(190, 265, id(font_small), cream, TextAlign::CENTER, "Button A");
      it.filled_rectangle(400, 220, 300, 90, Color(0x8A, 0x44, 0x22));
      it.print(550, 265, id(font_small), cream, TextAlign::CENTER, "Button B");
      it.printf(40, 340, id(font_small), cream, "Touches: %d", id(taps));
      if (id(tx) >= 0) it.filled_circle(id(tx), id(ty), 14, cream);

touchscreen:
  platform: gt911
  i2c_id: bus_a
  on_touch:
    then:
      - lambda: |-
          id(taps) += 1;
          id(tx) = touch.x;
          id(ty) = touch.y;
      - component.update: my_display
